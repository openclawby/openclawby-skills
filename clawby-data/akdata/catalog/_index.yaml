# ============================================================================
# akdata curated catalog — index
#
# These files document the LOCAL akshare interfaces (`ak.py call`), NOT the
# Clawby relay. They cover the high-frequency subset; the full machine-readable
# index of all ~1080 interfaces is generated locally by `ak.py index` and
# searched with `ak.py find` / `ak.py doc` / `ak.py cat`.
#
# `ak.py doc <func>` automatically attaches the block from these files, so the
# normal flow (find -> doc -> call) surfaces them without reading the yaml by hand.
#
# Each entry carries: params (format + example + choices) · returns (colnames) ·
# measured (real elapsed/rows/cols from a dated run) · gotchas · a CLI example.
# `status: broken` marks an interface that failed on every legal parameter
# combination, with the replacement named in its gotchas.
# ============================================================================
