# ============================================================================
# Address Intel — Category Index
# This directory provides on-chain address label / attribution lookup
# Call: POST /api/relay   {"name": "<name>", "params": {...}}
# ============================================================================
category_group: "Address Intel (on-chain address labels)"

note: >
  Interfaces require coin (chain ID) + address as mandatory params.
  coin is the chain ID with a suffix where applicable: Base=ETH-Base, Polygon=POL-Polygon,
  Arbitrum=ETH-Arbitrum, Optimism=ETH-Optimism, Avalanche=AVAX-Avalanche — always include the
  suffix, never use bare ETH for those chains. Other common ids: ETH / BNB / SOL / SUI / BTC / TRX / TON / HYPE.
  EVM addresses (0x) are automatically lowercased; Solana / SUI addresses are case-sensitive.
  Labels come from Clawby's LOCAL cache only — live upstream attribution (MistTrack / Blockberry)
  was discontinued, so a cache miss returns no_data (no on-demand lookup).

files:
  - file: labels.yaml
    description: "Address label / attribution lookup — local cache (2 interfaces)"
    interfaces:
      - name: address_labels
        summary: "Reads the local label cache; returns the cached label or no_data (alias of fast)"
      - name: address_labels_fast
        summary: "Local label cache only (instant, free; may return no_data)"

total_interfaces: 2
